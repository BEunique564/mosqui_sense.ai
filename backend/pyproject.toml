[project]
name = "mosquisense-backend"
version = "0.1.0"
description = "MosquiSense AI — FastAPI backend for predictive mosquito vector control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.3",
    "psycopg2-binary>=2.9.9",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.20.0",
    "shapely>=2.0.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "catboost>=1.2.2",
    "pytorch-forecasting>=1.0.0",
    "torch>=2.2.0",
    "feast>=0.35.0",
    "mlflow>=2.10.0",
    "ortools>=9.8.3296",
    "ultralytics>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
